[[evidence]]
id = "podman-5-4-container-drop-capability"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#dropcapability"
target = "5.4.0"
claim = "The Container section documents DropCapability as a space-separated list that removes capabilities from Podman's default set, may be listed multiple times, and accepts lowercase all to drop every capability."
test = "capabilities::supported_range_records_repeatable_container_drop_capability"
gap = "The generator matrix verifies emitted command arguments only. Rootless/rootful behavior, the effective bounding set, user-namespace effects, SELinux/seccomp interaction, and runtime privilege outcomes are not tested or claimed."

[[evidence]]
id = "podman-5-4-container-add-capability"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#addcapability"
target = "5.4.0"
claim = "The Container section documents AddCapability as a space-separated list added beyond Podman's default capability set and states that the key may be listed multiple times."
test = "capabilities::supported_range_records_repeatable_container_add_capability"
gap = "The Quadlet prose does not document the special all behavior. Tagged source and the generator matrix record that behavior separately. Rootless/rootful behavior, the effective bounding set, user-namespace effects, SELinux/seccomp interaction, and runtime privilege outcomes are not tested or claimed."

[[evidence]]
id = "podman-5-4-container-tmpfs"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#tmpfs"
target = "5.4.0"
claim = "The Container section documents Tmpfs as equivalent to Podman --tmpfs, generally in CONTAINER-DIR[:OPTIONS] form, and states that the key may be listed multiple times."
test = "capabilities::supported_range_records_repeatable_container_tmpfs"
gap = "The model and builder retain options as opaque authored text. Target-specific option availability, option validation, mount creation, rootless behavior, copy-up behavior, and runtime filesystem properties are not tested or claimed."

[[evidence]]
id = "podman-5-4-run-tmpfs"
