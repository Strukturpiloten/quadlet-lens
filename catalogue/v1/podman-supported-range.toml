schema = 1
id = "podman-supported-range"

[coverage]
minimum = "5.4.0"
maximum = "6.0.2"

[[evidence]]
id = "podman-5-4-general"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html"
target = "5.4.0"
claim = "Quadlet accepts regular systemd sections and documents container, pod, network, and volume unit files."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "The current generator fixture does not exercise every generic systemd key."

[[evidence]]
id = "podman-5-4-container"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#container-units-container"
target = "5.4.0"
claim = "The Container section documents AddHost, Image, Exec, Environment, EnvironmentFile, PublishPort, Volume, Network, Pod, HealthCmd, HealthInterval, HealthRetries, HealthStartPeriod, HealthTimeout, and PodmanArgs."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Referenced .image/.build units and the remaining container-only keys still need exact patch-matrix fixtures."

[[evidence]]
id = "podman-5-4-container-paths"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#volume"
target = "5.4.0"
claim = "Container Volume sources beginning with a dot resolve relative to the unit file, and .volume references create dependencies."
test = "capabilities::supported_range_records_paths_references_and_repetition"
gap = "Rootless and SELinux generator/runtime behavior is not yet automated."

[[evidence]]
id = "podman-5-4-pod"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#pod-units-pod"
target = "5.4.0"
claim = "The Pod section documents AddHost, PodName, PublishPort, Network, and Volume, including .network and .volume references."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Pod generation is covered through 6.0.2; rootless and rootful runtime behavior is not yet automated."

[[evidence]]
id = "podman-5-4-network"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#network-units-network"
target = "5.4.0"
claim = "The Network section and NetworkName key are documented for .network files."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Generated network creation is covered through 6.0.2; rootless and rootful runtime behavior is not yet automated."

[[evidence]]
id = "podman-5-4-volume"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#volume-units-volume"
target = "5.4.0"
claim = "The Volume section and VolumeName key are documented for .volume files."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Generated volume creation is covered through 6.0.2; rootless, rootful, and SELinux runtime behavior is not yet automated."

[[evidence]]
id = "podman-5-4-through-current-first-conversion-generators"
verification = "generator"
url = "https://github.com/containers/podman/releases"
versions = { minimum = "5.4.0", maximum = "6.0.2" }
claim = "Every Podman patch release from 5.4.0 through 6.0.2 generates the expected container, pod, network, volume, systemd, add-host, image, command, environment, environment-file, port, mount, resource-reference, health-command, health-timing, restart, and PodmanArgs fragments. The harness uses digest-pinned official immutable images through 5.8.2 and builds later exact release commits with a digest-pinned builder."
test = "generators::supported_generators_match_the_first_conversion_fixture"

[[capability]]
id = "systemd.section.pass-through"
description = "Ordinary systemd sections pass through the Quadlet generator."
unit_types = ["*"]
sections = ["Unit", "Service", "Install"]
repeatable = true
value_forms = ["systemd-unit-syntax"]
native = { minimum = "5.4.0", maximum = "6.0.2" }
evidence = ["podman-5-4-general", "podman-5-4-through-current-first-conversion-generators"]

[[capability]]
id = "systemd.service.restart"
description = "Service restart policy remains a generic systemd Service-section responsibility."
unit_types = ["*"]
sections = ["Service"]
value_forms = ["systemd-restart-policy"]
native = { minimum = "5.4.0", maximum = "6.0.2" }
evidence = ["podman-5-4-general", "podman-5-4-through-current-first-conversion-generators"]

