[[evidence]]
id = "podman-5-4-build-image-tag"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-build.unit.5.html#imagetag"
target = "5.4.0"
claim = "The Podman 5.4.0 Build-unit manual documents repeatable ImageTag entries as names assigned to the successfully built image."
test = "capabilities::supported_range_records_build_core"
gap = "QuadletLens retains every physical image-tag entry without parsing image-reference grammar or selecting a primary tag."

[[evidence]]
id = "podman-5-4-build-podman-args"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#podmanargs"
