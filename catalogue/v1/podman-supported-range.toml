schema = 1
id = "podman-supported-range"

[coverage]
minimum = "5.4.0"
maximum = "6.0.2"

[[evidence]]
id = "podman-5-4-general"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html"
target = "5.4.0"
claim = "Quadlet accepts regular systemd sections and documents container, pod, network, and volume unit files."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "The current generator fixture does not exercise every generic systemd key."

[[evidence]]
id = "podman-5-4-container"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#container-units-container"
target = "5.4.0"
claim = "The Container section documents AddHost, ContainerName, mutually exclusive Image and Rootfs workload sources, Entrypoint, RunInit, Exec, Environment, EnvironmentFile, repeatable Label assignments, repeatable Secret references and options, PublishPort, Volume, Network, Pod, HealthCmd, Notify including healthy readiness, HealthInterval, HealthRetries, HealthStartPeriod, HealthTimeout, and PodmanArgs."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Referenced .image/.build units and the remaining container-only keys still need exact patch-matrix fixtures."

[[evidence]]
id = "podman-5-4-container-paths"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#volume"
target = "5.4.0"
claim = "Container Volume sources beginning with a dot resolve relative to the unit file, and .volume references create dependencies."
test = "capabilities::supported_range_records_paths_references_and_repetition"
gap = "Rootless and SELinux generator/runtime behavior is not yet automated."

[[evidence]]
id = "podman-5-4-container-drop-capability"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#dropcapability"
target = "5.4.0"
claim = "The Container section documents DropCapability as a space-separated list that removes capabilities from Podman's default set, may be listed multiple times, and accepts lowercase all to drop every capability."
test = "capabilities::supported_range_records_repeatable_container_drop_capability"
gap = "The generator matrix verifies emitted command arguments only. Rootless/rootful behavior, the effective bounding set, user-namespace effects, SELinux/seccomp interaction, and runtime privilege outcomes are not tested or claimed."

[[evidence]]
id = "podman-5-4-container-add-capability"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#addcapability"
target = "5.4.0"
claim = "The Container section documents AddCapability as a space-separated list added beyond Podman's default capability set and states that the key may be listed multiple times."
test = "capabilities::supported_range_records_repeatable_container_add_capability"
gap = "The Quadlet prose does not document the special all behavior. Tagged source and the generator matrix record that behavior separately. Rootless/rootful behavior, the effective bounding set, user-namespace effects, SELinux/seccomp interaction, and runtime privilege outcomes are not tested or claimed."

[[evidence]]
id = "podman-5-4-container-tmpfs"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#tmpfs"
target = "5.4.0"
claim = "The Container section documents Tmpfs as equivalent to Podman --tmpfs, generally in CONTAINER-DIR[:OPTIONS] form, and states that the key may be listed multiple times."
test = "capabilities::supported_range_records_repeatable_container_tmpfs"
gap = "The model and builder retain options as opaque authored text. Target-specific option availability, option validation, mount creation, rootless behavior, copy-up behavior, and runtime filesystem properties are not tested or claimed."

[[evidence]]
id = "podman-5-4-run-tmpfs"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-run.1.html#tmpfsfs"
target = "5.4.0"
claim = "The Podman run --tmpfs option documents Linux default mount flags as its supported options and records rw,noexec,nosuid,nodev when no options are specified."
test = "capabilities::supported_range_records_repeatable_container_tmpfs"
gap = "This CLI documentation describes the target option surface and defaults; the generator fixture does not invoke Podman run, validate options, mount a filesystem, inspect flags, or exercise rootless/runtime behavior."

[[evidence]]
id = "podman-5-4-container-tmpfs-command-source"
verification = "documentation"
url = "https://github.com/containers/podman/blob/f9f7d48b24b1ca4403f189caaeab1cb8ff4a9aa2/pkg/systemd/quadlet/quadlet.go#L641-L651"
target = "5.4.0"
claim = "Tagged Podman 5.4.0 source maps Tmpfs through repeated-string command construction to --tmpfs; that helper obtains the effective entries with LookupAll."
test = "generators::supported_generators_match_the_first_conversion_fixture"
gap = "Source inspection and generated command text do not validate target-only mount options or establish runtime mount behavior."

