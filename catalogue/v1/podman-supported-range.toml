schema = 1
id = "podman-supported-range"

[coverage]
minimum = "5.4.0"
maximum = "6.0.2"

[[evidence]]
id = "podman-5-4-general"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html"
target = "5.4.0"
claim = "Quadlet accepts regular systemd sections and documents container, pod, network, and volume unit files."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "The current generator fixture does not exercise every generic systemd key."

[[evidence]]
id = "podman-5-4-container"
verification = "documentation"
url = "https://docs.podman.io/en/v5.4.0/markdown/podman-systemd.unit.5.html#container-units-container"
target = "5.4.0"
claim = "The Container section documents AddHost, ContainerName, mutually exclusive Image and Rootfs workload sources, Entrypoint, RunInit, Exec, Environment, EnvironmentFile, repeatable Label assignments, repeatable Secret references and options, PublishPort, Volume, Network, Pod, HealthCmd, Notify including healthy readiness, HealthInterval, HealthRetries, HealthStartPeriod, HealthTimeout, and PodmanArgs."
test = "capabilities::supported_range_has_the_reviewed_first_conversion_surface"
gap = "Referenced .image/.build units and the remaining container-only keys still need exact patch-matrix fixtures."

[[evidence]]
id = "podman-5-4-container-paths"
