schema = 1
id = "minimum-native-set"
suite = "typed-model"
description = "Protects the first-conversion container, pod, network, volume, reference, path, and generic systemd model surface."
secrets_reviewed = true
files = ["app.container", "application.pod", "cache.volume", "frontend.network"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No systemd specifiers are expanded and no Podman generator or runtime is invoked."

[expectations]
summary = "Known fields are typed while generic systemd sections, unknown keys, repeated keys, continuations, references, and paths remain source-aware."
