schema = 1
id = "minimum-native-set"
suite = "typed-model"
description = "Protects the first-conversion container, pod, network, volume, entrypoint, init-process, container stop-signal/timeout, pull policy, raw PID limit, raw container hostname, container/pod shared-memory size, repeated raw capability drops and additions, repeated raw temporary filesystems, kernel-parameter assignments, container-only resource limits, host-device mappings, container DNS resolver values and options, exposed host ports including SCTP-shaped text, OCI annotations, repeatable opaque Mask and Unmask values, singleton container AppArmor, NoNewPrivileges, SeccompProfile, and security-label selections, empty resets, and a raw singleton container memory limit, plus secret, container/pod user-namespace, execution-identity, reference, path, and generic systemd model surface."
secrets_reviewed = true
files = ["app.container", "application.pod", "cache.volume", "frontend.network"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "No systemd specifiers or authored paths are expanded or inspected, and no Podman generator or runtime is invoked."

[expectations]
summary = "Known fields, including JSON-array entrypoint, init-process selection, container stop signal and zero timeout, pull policy, raw zero PID limit, raw container hostname, raw container zero and pod unit-bearing shared-memory sizes, repeated ordered opaque capability drops, additions, temporary filesystems, kernel-parameter assignments, resource limits, host-device mappings, container DNS resolver values, options, search domains, exposed host ports including SCTP-shaped text, OCI annotations including malformed and key-only text and empty native reset assignments, repeated Mask and Unmask values including blank resets and final ALL or colon-path forms, singleton container AppArmor, NoNewPrivileges, SeccompProfile, and security-label selections, raw container Memory, repeated secrets, container/pod user namespaces, repeated supplementary groups, and execution context, are typed while corresponding pod, build, and other native-section security keys, pod Ulimit, AddDevice, Memory, DNS, DNSOption, DNSSearch, ExposeHostPort, Annotation, Mask, and Unmask, network DNSOption, build Annotation, generic systemd sections, unknown keys, continuations, references, and paths remain source-aware."
