[environment]
description = "Primary Podman 5.4.0, 5.5.0, 6.0.2, and 6.1.0 Quadlet and CLI documentation, reviewed tagged source behavior where recorded, and exact 5.4.0 through 6.1.0 generator evidence including isolated logging, network-identity, network driver/options/labels, network IPAM columns, network Internal/IPv6, Memory, ImageVolume, and security-option lanes; unverified runtime behavior and capabilities outside the protected fixtures retain explicit evidence gaps."

[expectations]
