schema = 1
id = "volume-driver-options-supported-range"
suite = "generators"
description = "Exercises singleton Volume Driver, Options, Device, and Type command construction across the complete supported Podman generator range."
secrets_reviewed = true
files = ["bind-requires-mounts.volume", "device-continuation.volume", "device-final-blank.volume", "device-matched-quote.volume", "device-specifier.volume", "device-unmatched-quote.volume", "driver-options.volume", "expected-fragments.txt", "options-bare.volume", "options-empty.volume", "options-matched-quote.volume", "type-final-blank.volume"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not create or inspect volumes, validate drivers or mount options, or start workloads."

[expectations]
summary = "Every recorded Podman release emits one final `--driver local`, `--opt device=tmpfs`, `--opt type=bind`, and `--opt o=final-option` after duplicate singleton values, without general option expansion. Separate units prove final blank Device and Type omission, matched/unmatched quote, specifier, continuation, and Type=bind RequiresMountsFor presentation."
