schema = 1
id = "build-arg-supported-range"
suite = "generators"
description = "Records BuildArg rejection or exclusion before Podman 5.7 and two explicit native --build-arg forms from 5.7.0 through 6.0.2."
secrets_reviewed = true
files = ["build-arg.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not resolve environments or secrets, build an image, or start a workload."

[expectations]
summary = "Podman 5.4.0 through 5.6.2 must reject or exclude BuildArg with no --build-arg mapping. Podman 5.7.0 through 6.0.2 must emit exactly --build-arg key=value and --build-arg empty=; bare and null-value behavior is intentionally unclaimed."
