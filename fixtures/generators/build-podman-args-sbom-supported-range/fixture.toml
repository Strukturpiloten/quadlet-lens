schema = 1
id = "build-podman-args-sbom-supported-range"
suite = "generators"
description = "Records one exact ordered opaque Build PodmanArgs SBOM terminal pair across Podman 5.4.0 through 6.0.2."
secrets_reviewed = true
files = ["build-podman-args-sbom.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not create an SBOM file, download an image, run a scanner, or establish SBOM, PURL, attestation, publishing, provenance, runtime, security, Compose, or conversion behavior."

[expectations]
summary = "Every recorded generator emits one ordered terminal --sbom=syft --sbom-output=/tmp/quadlet-lens-sbom.json pair before final positional '.'. It rejects missing output, quoted, alternate, duplicate, and reordered spellings and proves command text only."
