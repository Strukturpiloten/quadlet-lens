schema = 1
id = "build-platform-supported-range"
suite = "generators"
description = "Records one opaque Build Arch and Variant command argument across Podman 5.4.0 through 6.0.2 without asserting their relative command order."
secrets_reviewed = true
files = ["build-platform.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not parse a platform, select defaults, build an image, inspect image metadata, or start a workload."

[expectations]
summary = "Every recorded generator must emit exactly one separate --arch arm64 and one separate --variant v8 argument, without a relative-order assertion. Platform grammar, host defaults, effective-last behavior, build execution, runtime, and cross-format behavior are intentionally unclaimed."
