schema = 1
id = "podman-args-interactive-supported-range"
suite = "generators"
description = "Exercises the exact generic Container PodmanArgs=--interactive escape-hatch form across the complete supported Podman generator range."
secrets_reviewed = true
files = ["expected-fragments.txt", "interactive.container"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not start generated services or container workloads, attach standard input, allocate a TTY, or inspect runtime state."

[expectations]
summary = "Every recorded Podman release emits exactly one separate --interactive argument immediately before the image in the generated podman run command, with no short, equals, quoted, alternate, or duplicate form. This proves generated command text only, not runtime stdin, attach, or TTY semantics."
