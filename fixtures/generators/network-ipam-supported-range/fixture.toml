schema = 1
id = "network-ipam-supported-range"
suite = "generators"
description = "Exercises singleton IPAMDriver blank behavior and reset-aware repeatable Subnet, Gateway, and IPRange columns across the complete supported Podman generator range."
secrets_reviewed = true
files = ["expected-fragments.txt", "ipam-columns.network", "ipam-driver-blank.network"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
