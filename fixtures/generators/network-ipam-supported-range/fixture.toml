[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not create or inspect networks, validate address grammar, IPAM-driver availability/defaults, provider behavior, or runtime state."

[expectations]
summary = "Every recorded Podman release emits one `--ipam-driver host-local`; then exactly two ordered subnet/gateway/ip-range groups after independently reset pre-values. The companion blank IPAMDriver unit emits no `--ipam-driver` form."
