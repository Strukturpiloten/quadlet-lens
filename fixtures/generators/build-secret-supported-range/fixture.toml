schema = 1
id = "build-secret-supported-range"
suite = "generators"
description = "Records two ordered opaque Build Secret command arguments across Podman 5.4.0 through 6.0.2 using placeholder source paths only."
secrets_reviewed = true
files = ["build-secret.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. The fixture has no secret material, does not resolve source paths, and does not build an image or start a workload."

[expectations]
summary = "Every recorded generator must emit exactly two separate ordered --secret arguments for the two placeholder-source forms. It does not claim bare, environment, argument, path-resolution, build, runtime, or cross-format behavior."
