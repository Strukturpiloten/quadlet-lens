[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not stop pods, start workloads, inspect runtime state, or apply timeout behavior."

[expectations]
summary = "Podman 5.4.0 through 5.6.2 reject the unsupported key. Podman 5.7.0 through 6.1.0 emits one final --time= form for the recorded values, chooses the final duplicate, and retains --time= for a final blank assignment."
