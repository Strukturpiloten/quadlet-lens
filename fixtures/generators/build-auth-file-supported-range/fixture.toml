description = "Exercises opaque singleton Build AuthFile values across the recorded Podman range."
secrets_reviewed = true
files = ["build-auth-file-single.build", "build-auth-file-last.build", "build-auth-file-empty.build", "expected-fragments.txt"]

[provenance]
source = "authored"
