[environment]
description = "The harness invokes only Podman's dry-run Quadlet generator; it neither reads the authored paths nor obtains, parses, or exposes credentials."

[expectations]
summary = "Every recorded Podman release emits one separate --authfile pair for a single value, keeps only the effective last repeated value, and emits no flag after a final empty value."
