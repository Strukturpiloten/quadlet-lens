description = "Records Image pull-control command construction and version boundaries without pulling an image or inferring registry, policy, TLS, platform, retry, or runtime behavior."
secrets_reviewed = true
files = ["image-completion.image", "expected-fragments.txt"]
[provenance]
source = "authored"
