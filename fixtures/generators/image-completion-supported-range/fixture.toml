[environment]
description = "Dry-run Quadlet generator only; no image is pulled, inspected, authenticated, or stored."
[expectations]
summary = "The generator retains final post-reset PodmanArgs in authored order. It rejects or excludes Retry/RetryDelay before 5.5.0 and Policy before 5.6.0; supported versions emit one exact policy, retry, retry-delay, TLS, variant, and terminal PodmanArgs form before the image source."
