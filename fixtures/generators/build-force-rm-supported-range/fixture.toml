schema = 1
id = "build-force-rm-supported-range"
suite = "generators"
description = "Exercises opaque singleton Build ForceRM values across the recorded Podman range."
secrets_reviewed = true
files = ["build-force-rm-true.build", "build-force-rm-false.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not execute a build, remove resources, inspect failures, read defaults or configuration, or establish cache behavior."

[expectations]
summary = "Every recorded Podman release from 5.4.0 through 6.1.0 emits one bare --force-rm for ForceRM=true and one --force-rm=false for ForceRM=false, each before its final positional '.'."
