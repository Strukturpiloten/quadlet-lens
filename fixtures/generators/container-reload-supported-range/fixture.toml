schema = 1
id = "container-reload-supported-range"
suite = "generators"
description = "Exercises opaque singleton Container ReloadCmd and ReloadSignal presentation, including final blank and malformed ReloadCmd behavior, across the recorded Podman range."
secrets_reviewed = true
files = [
  "expected-fragments.txt",
  "reload-command.container",
  "reload-command-final-blank.container",
  "reload-command-malformed.container",
  "reload-signal.container"
]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not start workloads, inspect containers, execute reload commands, or send signals."

[expectations]
summary = "Podman 5.4.0 through 5.4.2 reject the unsupported keys. Podman 5.5.x emits cidfile-targeted command and signal ExecReload forms; Podman 5.6.0 through 6.1.0 emits generated-name forms. A final blank ReloadCmd emits no ExecReload action while an unmatched quote is tokenized into the recorded command text."
