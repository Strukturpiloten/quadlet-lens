schema = 1
id = "build-pull-supported-range"
suite = "generators"
description = "Records one opaque Build Pull command argument across Podman 5.4.0 through 6.1.0."
secrets_reviewed = true
files = ["build-pull.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not pull an image, build an image, or start a workload."

[expectations]
summary = "Every recorded generator must emit exactly one --pull=always argument. Blank Pull omission, policy acceptance, default selection, registry behavior, image availability, runtime behavior, and cross-format mapping are intentionally unclaimed."
