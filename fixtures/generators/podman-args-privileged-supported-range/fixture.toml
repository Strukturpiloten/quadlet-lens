schema = 1
id = "podman-args-privileged-supported-range"
suite = "generators"
description = "Exercises exact generic Container PodmanArgs privileged true and false forms across the complete supported Podman generator range."
secrets_reviewed = true
files = ["expected-fragments.txt", "privileged-false.container", "privileged-true.container"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not start generated services or container workloads, create devices, inspect LSM or seccomp state, or inspect rootless/runtime state."

[expectations]
summary = "Every recorded Podman release emits exactly one --privileged argument immediately before the true-unit image and exactly one --privileged=false argument immediately before the false-unit image, with no --privileged=true, positional false, short, quoted, bundled, alternate, duplicate, or conflicting form. This proves generated command text only, not runtime privileges, devices, LSM, seccomp, rootless, or workload behavior."
