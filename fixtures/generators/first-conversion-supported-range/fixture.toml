schema = 1
id = "first-conversion-supported-range"
suite = "generators"
description = "Exercises the first-conversion container, pod, network, volume, image/rootfs workload sources, explicit container name, isolated container hostname, container/pod shared-memory sizes, isolated repeated capability drops and additions plus drop-all/add-one ordering, isolated post-reset temporary-filesystem, kernel-parameter, resource-limit, and host-device output, JSON-array entrypoint, explicit true/false init selection, named/numeric stop signals, positive and zero stop timeouts, isolated always/missing/never/newer pull policies, isolated positive/unlimited PID limits, add-host, label, secret, container/pod user namespaces, execution identity, path, reference, health command/timing/readiness, dependency ordering, continuation, and generic systemd surface against exact Podman generators."
secrets_reviewed = true
files = ["app.container", "app.network", "application.pod", "cap-add.container", "cap-drop.container", "cap-drop-all-add-one.container", "data.volume", "device.container", "expected-fragments.txt", "hostname.container", "no-health.container", "numeric-stop-signal.container", "pids-limit-finite.container", "pids-limit-unlimited.container", "pull-always.container", "pull-missing.container", "pull-never.container", "pull-newer.container", "rootfs.container", "run-init-false.container", "shm-size-container.container", "shm-size-pod-member.container", "shm-size.pod", "shm-size-zero.container", "sysctl.container", "tmpfs.container", "ulimit.container", "worker.container", "worker.env", "zero-stop-timeout.container"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only the containerized Quadlet generator in dry-run mode. It does not start generated services or container workloads."

[expectations]
summary = "Every verified generator succeeds and emits stable image/rootfs, container-name, exactly one isolated container-hostname argument, exactly one matching positive-container, zero-container, and pod-owned shared-memory argument, exactly four ordered lowercase capability-drop arguments with no additions in the drop fixture, exactly four ordered lowercase capability-add arguments with no drops in the add fixture, exactly one drop-all before one add-one argument in the combined fixture, exactly one final post-reset `--tmpfs /data:mode=755,uid=1009,gid=1009` with no pre-reset path or other tmpfs form, exactly one final post-reset `--sysctl net.ipv4.ip_forward=1` with neither pre-reset setting nor any other sysctl form, exactly two ordered final post-reset `--ulimit nproc=4096:8192` and `--ulimit stack=-1:-1` arguments with neither pre-reset limit nor empty/alternate form, and exactly two ordered final post-reset `--device /dev/null:/dev/final-null:r` and `--device /dev/zero:/dev/final-zero:w` arguments with neither pre-reset mapping nor empty/alternate form, plus JSON-array entrypoint, explicit `--init`/`--init=false` selection, named/numeric stop-signal, positive/zero stop-timeout, isolated `--pull always`/`missing`/`never`/`newer` selection, isolated positive/`-1` `--pids-limit` selection, add-host, label, secret, container/pod user-namespace, execution-identity, health-readiness, dependency-ordering, and service fragments while preserving Podman 5.4-compatible behavior."
