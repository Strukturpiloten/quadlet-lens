schema = 1
id = "first-conversion-supported-range"
suite = "generators"
description = "Exercises the first-conversion container, pod, network, volume, build image-tag/repeated-Network/two portable Label values/repeated-File/Target/working-directory, image/rootfs workload sources, focused quoted literal Environment assignments for empty, space, equals, quote, backslash, dollar, and Unicode values plus two distinct assignments grouped in one physical directive, explicit container name, isolated container hostname, container/pod shared-memory sizes, isolated repeated capability drops and additions plus drop-all/add-one ordering, isolated post-reset temporary-filesystem, kernel-parameter, resource-limit, host-device, container DNS, DNS-option, DNS-search, exposed-host-port, and OCI-annotation output, JSON-array entrypoint, explicit true/false init selection, named/numeric stop signals, positive and zero stop timeouts, isolated always/missing/never/newer pull policies, isolated positive/unlimited PID limits, add-host, label, secret, container/pod user namespaces, execution identity, path, reference, health command/timing/readiness, dependency ordering, continuation, and generic systemd surface against exact Podman generators."
secrets_reviewed = true
files = ["annotation.container", "app.container", "app.network", "application.build", "application.pod", "cap-add.container", "cap-drop.container", "cap-drop-all-add-one.container", "data.volume", "device.container", "dns.container", "dns-option.container", "dns-search.container", "expected-fragments.txt", "expose-host-port.container", "hostname.container", "no-health.container", "numeric-stop-signal.container", "pids-limit-finite.container", "pids-limit-unlimited.container", "pull-always.container", "pull-missing.container", "pull-never.container", "pull-newer.container", "rootfs.container", "run-init-false.container", "shm-size-container.container", "shm-size-pod-member.container", "shm-size.pod", "shm-size-zero.container", "sysctl.container", "tmpfs.container", "ulimit.container", "worker.container", "worker.env", "zero-stop-timeout.container"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only the containerized Quadlet generator in dry-run mode. It does not start generated services or container workloads."

[expectations]
summary = "Every verified generator succeeds and emits stable image/rootfs, seven focused whole quoted literal environment assignments as one `--env` argument each for an empty, space, equals, quote, backslash, dollar, and printable-Unicode value, plus two distinct `--env` arguments from one grouped physical Environment directive rather than one flattened combined argument, two ordered build image tags, three ordered build network arguments for host, none, and the referenced network with an exact dependency, exactly one `--label build.label=one` and one `--label empty=` argument without `--label=` forms, one final repeated-File `--file Containerfile.final` argument (without the earlier File), one `--target build-stage` argument, and the file-derived service working directory. This Build assertion covers only those two portable label values, not bare labels, duplicate ordering or collapse, label grammar, build execution, runtime, or cross-format behavior; the remaining fixture assertions cover container-name, shared memory, capabilities, resets, DNS, exposure, annotations, process selection, identity, health, dependencies, and service fragments while preserving Podman 5.4-compatible behavior."
