schema = 1
id = "first-conversion-supported-range"
suite = "generators"
description = "Exercises the first-conversion container, pod, network, volume, add-host, path, reference, health, continuation, and generic systemd surface against exact Podman generators."
secrets_reviewed = true
files = ["app.container", "app.network", "application.pod", "data.volume", "expected-fragments.txt", "no-health.container", "worker.container", "worker.env"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only the containerized Quadlet generator in dry-run mode. It does not start generated services or container workloads."

[expectations]
summary = "Every verified generator succeeds and emits stable add-host and service fragments while preserving Podman 5.4-compatible behavior."
