schema = 1
id = "container-batch-supported-range"
suite = "generators"
description = "Exercises isolated Container AutoUpdate registry/local forms, all CgroupsMode forms, EnvironmentHost, reset-aware Mount, ReadOnlyTmpfs, Timezone, and HealthOnFailure command construction across the complete supported Podman generator range."
secrets_reviewed = true
files = ["auto-local.container", "batch.container", "cgroups-disabled.container", "cgroups-enabled.container", "cgroups-no-conmon.container", "cgroups-split.container", "completion.container", "expected-fragments.txt", "mount-reset.container"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only with label separation disabled and invokes only exact Podman Quadlet generators in dry-run mode. It does not read process, proxy, timezone, or filesystem state; pull images; create mounts; or start workloads."

[expectations]
summary = "Every recorded Podman release emits established batch arguments plus reset-aware Container configuration/global arguments, health log/startup pairs, and final ServiceName output naming."
