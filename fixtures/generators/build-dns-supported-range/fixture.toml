schema = 1
id = "build-dns-supported-range"
suite = "generators"
description = "Exercises repeatable opaque Build DNS values across the recorded Podman range."
secrets_reviewed = true
files = ["build-dns.build", "expected-fragments.txt"]

[provenance]
source = "authored"
license = "MPL-2.0"
redistribution = "allowed"
modifications = "none"

[environment]
description = "The harness mounts this directory read-only and invokes only Podman's dry-run Quadlet generator. It does not execute a build, resolve DNS, read resolv.conf, inspect host DNS, or establish runtime behavior."

[expectations]
summary = "Every recorded Podman release from 5.4.0 through 6.0.2 emits ordered separate --dns 9.9.9.9 then --dns 2001:4860:4860::8888 pairs before its final positional '.', without a relative-order claim against map-derived flags."
