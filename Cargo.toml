[package]
name = "quadlet-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Source-aware Rust library for parsing, validating, generating, and rendering Podman Quadlet files"
documentation = "https://docs.rs/quadlet-lens"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["configuration", "containers", "podman", "quadlet", "systemd"]
categories = ["config", "parser-implementations"]

[package.metadata.strukturpiloten]
company = "Strukturpiloten OHG"
github = "https://github.com/TheRealBecks"
maintainer = 'Martin "Becks" Beckert'
website = "https://www.strukturpiloten.de/"

[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://boxferry.dev/docs/libraries/quadlet-lens/"
repository = "https://github.com/Strukturpiloten/quadlet-lens"
license = "MPL-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[lints]
workspace = true
