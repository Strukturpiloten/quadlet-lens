---
name: External documentation link health

on:
  schedule:
    - cron: "49 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-documentation-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  links:
    name: Rate-limited external links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore successful link responses
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: documentation-links-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            documentation-links-${{ runner.os }}-

      - name: Install canonical Lychee
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/quadlet-lens-link-tools"
          python3 scripts/shared-ci.py tools --destination "${tool_dir}" --tools lychee
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Check external documentation links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --config lychee.toml --root-dir "${GITHUB_WORKSPACE}" --cache './**/*.md'
